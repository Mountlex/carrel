name: iOS

on:
  pull_request:
    paths: ['Carrel/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['Carrel/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime,devices in data["devices"].items() if "iOS-26" in runtime for device in devices if device["name"].startswith("iPhone")))')
          echo "IOS_TEST_DEVICE=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test
        run: >-
          xcodebuild -project Carrel/Carrel.xcodeproj -scheme Carrel
          -configuration Debug
          -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE"
          -resultBundlePath TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
