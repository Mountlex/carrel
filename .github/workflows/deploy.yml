name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Validate code and compiler image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install compiler service dependencies
        run: npm ci --omit=dev --prefix latex-service

      - name: Lint, check TypeScript regressions, and test
        run: bun run check

      - name: Build frontend
        run: bun run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud

      - uses: docker/setup-buildx-action@v3

      - name: Build and verify production compiler image
        uses: docker/build-push-action@v6
        with:
          context: latex-service
          push: false
          cache-from: type=gha,scope=latex-service
          cache-to: type=gha,mode=max,scope=latex-service

  deploy-backend:
    name: Deploy Convex
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Convex
        run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

  deploy-frontend:
    name: Deploy Cloudflare
    needs: [check, deploy-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-latex-service:
    name: Deploy LaTeX Service
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, check if latex-service exists
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            # Check if latex-service changed since previous tag
            if git diff --name-only $PREV_TAG HEAD | grep -q "^latex-service/"; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changes.outputs.changed == 'true'

      - name: Deploy to Fly.io
        if: steps.changes.outputs.changed == 'true'
        run: flyctl deploy --remote-only --strategy rolling --update-only
        working-directory: latex-service
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Skip deployment
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes to latex-service, skipping deployment"
